services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a2ui-backend
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - a2ui-network
      - odoo194_default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost/api
    container_name: a2ui-frontend-builder
    volumes:
      - frontend_dist:/app/dist
    networks:
      - a2ui-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: a2ui-nginx
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - a2ui-network
    restart: unless-stopped

volumes:
  frontend_dist:

networks:
  a2ui-network:
    driver: bridge
  odoo194_default:
    external: true
