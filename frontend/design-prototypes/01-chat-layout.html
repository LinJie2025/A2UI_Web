<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Chat — 智能 ERP 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f8fafb;
    --bg-card: #ffffff;
    --bg-elevated: #f1f5f9;
    --bg-hover: #f8fafc;
    --border-subtle: #e2e8f0;
    --border-active: #93c5fd;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent-primary: #2563eb;
    --accent-primary-light: #eff6ff;
    --accent-teal: #0d9488;
    --accent-warm: #f97316;
    --accent-success: #10b981;
    --accent-danger: #ef4444;
    --accent-purple: #8b5cf6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
    --radius-sm: 0.5rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --font-display: 'Outfit', system-ui, sans-serif;
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-body);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.65;
    overflow: hidden;
    height: 100vh;
  }

  /* Subtle background texture */
  .bg-subtle {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(37,99,235,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 80%, rgba(13,148,136,0.03) 0%, transparent 60%),
      var(--bg-page);
  }
  .bg-dots {
    position: fixed; inset: 0; z-index: 0; opacity: 0.25; pointer-events: none;
    background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
    background-size: 20px 20px;
  }

  /* Scrollbar */
  .scroll-thin::-webkit-scrollbar { width: 5px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Card surface */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .card-hover:hover {
    border-color: var(--border-active);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  /* Animations */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardGrow {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes typewriterCursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .animate-fade-up { animation: fadeSlideUp 0.35s ease-out both; }
  .animate-card-grow { animation: cardGrow 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .cursor-blink::after { content: '▍'; animation: typewriterCursor 0.8s step-end infinite; color: var(--accent-primary); margin-left: 1px; }

  /* A2UI Card */
  .a2ui-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .a2ui-card:hover {
    border-color: var(--border-active);
    box-shadow: var(--shadow-md);
  }
  .a2ui-card-header {
    padding: 0.75rem 1rem;
    background: #f8fafc;
    border-bottom: 1px solid var(--border-subtle);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--accent-primary);
    display: flex; align-items: center; gap: 0.5rem;
  }

  /* Buttons */
  .a2ui-btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.8125rem;
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
    border: none;
    min-height: 44px;
    min-width: 44px;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
    letter-spacing: 0.01em;
  }
  .a2ui-btn-primary {
    background: var(--accent-primary);
    color: #fff;
    box-shadow: 0 1px 3px rgba(37,99,235,0.2);
  }
  .a2ui-btn-primary:hover {
    background: #1d4ed8;
    box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    transform: translateY(-1px);
  }
  .a2ui-btn-primary:active { transform: scale(0.97); background: #1e40af; }
  .a2ui-btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-sm);
  }
  .a2ui-btn-secondary:hover {
    border-color: var(--border-active);
    background: var(--accent-primary-light);
    color: var(--accent-primary);
  }
  .a2ui-btn-ghost {
    background: transparent;
    color: var(--text-secondary);
  }
  .a2ui-btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* Input */
  .a2ui-input {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 0.625rem 0.875rem;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.875rem;
    width: 100%;
    transition: all 0.2s;
    min-height: 44px;
  }
  .a2ui-input:focus {
    outline: none;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .a2ui-input::placeholder { color: var(--text-muted); }

  /* Tool Bubble */
  .tool-bubble {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.25rem 0.625rem;
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    font-weight: 500;
  }
  .tool-bubble-loading {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #92400e;
  }
  .tool-bubble-success {
    background: #d1fae5;
    border: 1px solid #6ee7b7;
    color: #065f46;
  }

  /* Mobile Sidebar */
  @media (max-width: 768px) {
    .sidebar-desktop { display: none; }
    .menu-btn { display: flex !important; }
    .sidebar-mobile {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-lg);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-mobile.open { transform: translateX(0); }
  }
  @media (min-width: 769px) {
    .sidebar-mobile, .sidebar-overlay, .menu-btn { display: none; }
  }

  .sidebar-overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(15,23,42,0.2);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="antialiased">

<div class="bg-dots"></div>

<div class="relative z-10 h-screen flex flex-col">

  <!-- ═══ TOP NAVBAR ═══ -->
  <header class="card h-14 flex items-center px-4 shrink-0 z-30 rounded-none border-t-0 border-l-0 border-r-0">

    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #2563eb, #0d9488);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>

    <nav class="flex items-center gap-1" aria-label="主导航">
      <a href="#" class="px-3 py-1.5 rounded-lg text-sm font-medium text-blue-600 bg-blue-50">聊天</a>
      <a href="#" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-50 transition-colors">工具</a>
      <a href="#" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-50 transition-colors">管理</a>
    </nav>
    <div class="flex-1"></div>

    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-500 hidden sm:inline">管理员</span>

      <nav class="flex-1 overflow-y-auto scroll-thin px-2" aria-label="对话列表">

            <div class="text-sm truncate">库存查询 — 产品列表</div>

          <div class="conv-item px-3 py-2.5 rounded-lg cursor-pointer transition-colors hover:bg-slate-50 text-slate-600" onclick="selectConv(this)">

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script>
let messageIdCounter = 0;
let isStreaming = false;

function toggleSidebar() {
  const overlay = document.getElementById('sidebarOverlay');
  const mobile = document.getElementById('sidebarMobile');
  overlay.classList.toggle('open');
  mobile.classList.toggle('open');
}

function selectConv(el) {
  document.querySelectorAll('.conv-item').forEach(i => {
    i.classList.remove('active');
    i.style.background = '';
    i.style.color = '#475569';
    i.style.fontWeight = '500';
  });
  el.classList.add('active');
  el.style.background = 'var(--accent-primary-light)';
  el.style.color = 'var(--accent-primary)';
  el.style.fontWeight = '600';
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendPreset(type) {
  const input = document.getElementById('chatInput');
  input.value = getPresetText(type);
  sendMessage();
}
function getPresetText(type) {
  if (type === '库存查询') return '帮我查一下仓库里所有产品的库存情况';
  if (type === '采购订单') return '我要创建一个新的采购订单，供应商是「深圳科技有限公司」';
  if (type === '客户查询') return '帮我查一下最近有哪些新客户';
  return type;
}

function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const welcome = document.getElementById('welcomeState');
  if (welcome) welcome.style.display = 'none';
  addUserMessage(text);
  input.value = '';
  input.style.height = 'auto';
  simulateAIResponse(text);
}

function addUserMessage(text) {
  const id = 'msg-' + (++messageIdCounter);
  const list = document.getElementById('messagesList');
  const el = document.createElement('div');
  el.id = id;
  el.className = 'flex justify-end animate-fade-up';
  el.innerHTML = `<div class="max-w-[80%] sm:max-w-[70%] px-4 py-2.5 rounded-2xl rounded-br-md text-sm leading-relaxed text-white" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 2px 8px rgba(37,99,235,0.2);">${escapeHtml(text)}</div>`;
  list.appendChild(el);
  scrollToBottom();
}

async function simulateAIResponse(userText) {
  isStreaming = true;
  document.getElementById('sendBtn').style.opacity = '0.55';
  const streamingId = 'streaming-' + (++messageIdCounter);
  const list = document.getElementById('messagesList');
  const el = document.createElement('div');
  el.id = streamingId;
  el.className = 'animate-fade-up';
  list.appendChild(el);
  scrollToBottom();
  const lower = userText.toLowerCase();
  if (lower.includes('库存') || lower.includes('产品')) await simulateStockResponse(el, streamingId);
  else if (lower.includes('采购') || lower.includes('订单')) await simulatePurchaseResponse(el, streamingId);
  else if (lower.includes('客户')) await simulateCustomerResponse(el, streamingId);
  else await simulateGenericResponse(el, streamingId);
  isStreaming = false;
  document.getElementById('sendBtn').style.opacity = '1';
  document.getElementById('chatInput').focus();
}

function buildAIMessageStart() {
  return `<div class="flex gap-3 max-w-[85%] sm:max-w-[80%]">
    <div class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center" style="background:var(--accent-primary-light);border:1px solid rgba(37,99,235,0.15);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round">
        <path d="M12 2a4 4 0 014 4c0 2-2 6-4 8-2-2-4-6-4-8a4 4 0 014-4z"/><circle cx="12" cy="6" r="1.5" fill="#2563eb" stroke="none"/>
      </svg>
    </div>
    <div class="flex-1 min-w-0">
      <div class="text-xs text-slate-400 mb-1 font-display font-medium">A2UI 助手</div>
      <div class="ai-text text-sm leading-relaxed text-slate-700"></div>
    </div></div>`;
}

async function streamText(container, text) {
  for (let i = 0; i < text.length; i++) {
    container.textContent = text.substring(0, i + 1);
    container.classList.add('cursor-blink');
    await sleep(22 + Math.random() * 18);
    scrollToBottom();
  }
  container.classList.remove('cursor-blink');
}

function addToolCallBubble(parent, toolName, status) {
  const bubble = document.createElement('div');
  bubble.className = 'tool-bubble tool-bubble-loading mt-2 ml-11';
  bubble.innerHTML = `<div class="w-3 h-3 rounded-full border-2 border-amber-400 border-t-transparent" style="animation:spin 0.8s linear infinite;"></div><span>${toolName} 执行中...</span>`;
  parent.appendChild(bubble);
}
function updateLastToolBubble(parent, toolName, status, result) {
  const bubbles = parent.querySelectorAll('.tool-bubble');
  const last = bubbles[bubbles.length - 1];
  if (last) {
    last.className = 'tool-bubble tool-bubble-success mt-2 ml-11 animate-fade-up';
    last.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent-success)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg><span>${toolName} · ${result}</span>`;
  }
}

// ─── Stock Response ───
async function simulateStockResponse(el, id) {
  el.innerHTML = buildAIMessageStart();
  const tc = el.querySelector('.ai-text');
  await streamText(tc, '好的，我帮你查询了仓库库存。以下是当前的产品列表：');
  addToolCallBubble(el, 'product_search', 'loading');
  await sleep(600);
  updateLastToolBubble(el, 'product_search', 'success', '返回 5 条记录');
  await sleep(400);
  const card = document.createElement('div');
  card.className = 'mt-3 ml-11 animate-card-grow';
  card.innerHTML = buildProductListCard();
  el.appendChild(card);
  scrollToBottom();
}

// ─── Purchase Response ───
async function simulatePurchaseResponse(el, id) {
  el.innerHTML = buildAIMessageStart();
  await streamText(el.querySelector('.ai-text'), '好的，我来帮你创建采购订单。请填写以下信息：');
  await sleep(400);
  const form = document.createElement('div');
  form.className = 'mt-3 ml-11 animate-card-grow';
  form.innerHTML = buildPurchaseFormCard();
  el.appendChild(form);
  scrollToBottom();
  setTimeout(() => {
    const btn = document.getElementById('purchase-submit');
    if (btn) btn.addEventListener('click', () => handlePurchaseSubmit(el, id));
  }, 100);
}

// ─── Customer Response ───
async function simulateCustomerResponse(el, id) {
  el.innerHTML = buildAIMessageStart();
  await streamText(el.querySelector('.ai-text'), '为你找到了最近的客户信息：');
  addToolCallBubble(el, 'customer_search', 'loading');
  await sleep(600);
  updateLastToolBubble(el, 'customer_search', 'success', '返回 3 条记录');
  await sleep(400);
  const card = document.createElement('div');
  card.className = 'mt-3 ml-11 animate-card-grow';
  card.innerHTML = buildCustomerListCard();
  el.appendChild(card);
  scrollToBottom();
}

async function simulateGenericResponse(el, id) {
  el.innerHTML = buildAIMessageStart();
  await streamText(el.querySelector('.ai-text'), '收到你的消息。我理解你想要进行相关操作，让我帮你处理...');
}

// ─── A2UI Cards ───
function buildProductListCard() {
  const products = [
    { name:'iPhone 15 Pro', sku:'SKU-001', qty:128, location:'A-03-12', status:'充足' },
    { name:'MacBook Air M3', sku:'SKU-002', qty:45, location:'B-01-08', status:'正常' },
    { name:'AirPods Pro 2', sku:'SKU-003', qty:312, location:'A-05-21', status:'充足' },
    { name:'iPad Mini', sku:'SKU-004', qty:8, location:'C-02-04', status:'低库存' },
    { name:'Apple Watch S9', sku:'SKU-005', qty:67, location:'B-03-15', status:'正常' },
  ];
  let rows = '';
  products.forEach(p => {
    const sc = p.status === '低库存' ? '#ef4444' : p.status === '正常' ? '#f59e0b' : '#10b981';
    rows += `<tr class="border-b border-slate-50 hover:bg-slate-50/60 transition-colors cursor-pointer">
      <td class="py-2.5 px-3 text-sm font-medium text-slate-700">${escapeHtml(p.name)}</td>
      <td class="py-2.5 px-3 text-xs text-slate-400 font-mono hidden sm:table-cell">${p.sku}</td>
      <td class="py-2.5 px-3 text-sm text-right font-mono font-medium text-slate-700">${p.qty}</td>
      <td class="py-2.5 px-3 text-xs text-slate-400 hidden md:table-cell">${p.location}</td>
      <td class="py-2.5 px-3 text-right hidden sm:table-cell">
        <span class="inline-flex items-center gap-1 text-xs font-medium" style="color:${sc}">
          <span class="w-1.5 h-1.5 rounded-full" style="background:${sc}"></span>${p.status}</span></td></tr>`;
  });
  return `<div class="a2ui-card" style="max-width:640px;">
    <div class="a2ui-card-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>产品库存列表<span class="ml-auto text-xs text-slate-400 font-normal">5 条记录</span></div>
    <div class="overflow-x-auto"><table class="w-full"><thead><tr class="text-xs text-slate-400 border-b border-slate-100"><th class="text-left py-2 px-3 font-medium">产品名称</th><th class="text-left py-2 px-3 font-medium hidden sm:table-cell">SKU</th><th class="text-right py-2 px-3 font-medium">库存</th><th class="text-left py-2 px-3 font-medium hidden md:table-cell">库位</th><th class="text-right py-2 px-3 font-medium hidden sm:table-cell">状态</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="p-3 border-t border-slate-100 flex gap-2"><button class="a2ui-btn a2ui-btn-secondary text-xs" onclick="alert('导出')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出</button><button class="a2ui-btn a2ui-btn-primary text-xs" onclick="alert('详情')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>查看详情</button></div></div>`;
}

function buildPurchaseFormCard() {
  return `<div class="a2ui-card" style="max-width:520px;">
    <div class="a2ui-card-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>创建采购订单</div>
    <div class="p-4 space-y-3">
      <div><label class="block text-xs text-slate-500 mb-1 font-medium">供应商</label><select class="a2ui-input" style="appearance:none;cursor:pointer;"><option>深圳科技有限公司</option><option>广州电子有限公司</option><option>北京数码科技</option></select></div>
      <div><label class="block text-xs text-slate-500 mb-1 font-medium">产品</label><select class="a2ui-input" style="appearance:none;cursor:pointer;"><option>请选择...</option><option>iPhone 15 Pro</option><option>MacBook Air M3</option></select></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-slate-500 mb-1 font-medium">数量</label><input type="number" class="a2ui-input" min="1" value="100"></div>
        <div><label class="block text-xs text-slate-500 mb-1 font-medium">单价 (元)</label><input type="number" class="a2ui-input" step="0.01" value="5999.00"></div></div>
      <div><label class="block text-xs text-slate-500 mb-1 font-medium">预计交货日期</label><input type="date" class="a2ui-input" value="2026-08-15"></div>
      <div><label class="block text-xs text-slate-500 mb-1 font-medium">备注</label><textarea class="a2ui-input" rows="2" placeholder="备注..."></textarea></div>
    </div>
    <div class="p-3 border-t border-slate-100 flex gap-2 justify-end" id="purchase-form-actions">
      <button class="a2ui-btn a2ui-btn-secondary text-xs" onclick="this.closest('.a2ui-card').style.display='none'">取消</button>
      <button class="a2ui-btn a2ui-btn-primary text-xs" id="purchase-submit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>提交订单</button></div></div>`;
}
function handlePurchaseSubmit(el, msgId) {
  const actions = document.getElementById('purchase-form-actions');
  if (!actions) return;
  actions.innerHTML = `<div class="flex items-center gap-2 text-sm text-slate-500"><div class="w-4 h-4 rounded-full border-2 border-blue-400 border-t-transparent" style="animation:spin 0.8s linear infinite;"></div>正在提交...</div>`;
  setTimeout(() => {
    actions.innerHTML = `<div class="flex items-center gap-2 text-sm text-emerald-600 animate-fade-up"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span class="font-semibold">订单已创建！PO-2026-0815</span></div>`;
  }, 1500);
}

function buildCustomerListCard() {
  const cs = [
    { name:'深圳科技有限公司', contact:'张经理', phone:'138****6789', orders:12, total:'¥856,200' },
    { name:'广州电子有限公司', contact:'李总监', phone:'139****8901', orders:8, total:'¥432,500' },
    { name:'北京数码科技', contact:'王总', phone:'136****0123', orders:5, total:'¥298,000' },
  ];
  let items = '';
  cs.forEach(c => {
    items += `<div class="a2ui-card p-4 hover:border-blue-300 cursor-pointer" style="margin:-1px;border-radius:0;"><div class="flex items-start justify-between"><div><div class="text-sm font-medium text-slate-700">${escapeHtml(c.name)}</div><div class="text-xs text-slate-400 mt-0.5">${c.contact} · ${c.phone}</div></div><div class="text-right"><div class="text-sm font-mono font-medium text-slate-700">${c.total}</div><div class="text-xs text-slate-400">${c.orders} 笔订单</div></div></div></div>`;
  });
  return `<div class="a2ui-card" style="max-width:480px;"><div class="a2ui-card-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>客户列表<span class="ml-auto text-xs text-slate-400 font-normal">3 条记录</span></div><div>${items}</div><div class="p-3 border-t border-slate-100 flex justify-end"><button class="a2ui-btn a2ui-btn-primary text-xs">查看全部客户</button></div></div>`;
}

function startNewChat() {
  const list = document.getElementById('messagesList');
  list.innerHTML = `<div id="welcomeState" class="flex flex-col items-center justify-center py-20 text-center"><div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-6" style="background:var(--accent-primary-light);border:1px solid rgba(37,99,235,0.15);"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><path d="M8 9h8M8 13h6"/></svg></div><h2 class="font-display text-xl font-bold mb-2 text-slate-800">你好，我是 A2UI 助手</h2><p class="text-slate-500 max-w-md">问我任何关于库存、订单、客户、采购的问题 — 我会直接返回可操作的界面。</p><div class="flex flex-wrap gap-2 justify-center mt-5"><button onclick="sendPreset('库存查询')" class="a2ui-btn a2ui-btn-secondary text-xs">帮我查库存</button><button onclick="sendPreset('采购订单')" class="a2ui-btn a2ui-btn-secondary text-xs">创建采购订单</button><button onclick="sendPreset('客户查询')" class="a2ui-btn a2ui-btn-secondary text-xs">查客户信息</button></div></div>`;
  if (window.innerWidth < 769) toggleSidebar();
  document.getElementById('chatInput').focus();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function scrollToBottom() { const area = document.getElementById('messagesArea'); if (area) area.scrollTop = area.scrollHeight; }

document.addEventListener('DOMContentLoaded', () => { document.getElementById('chatInput').focus(); });
</script>
