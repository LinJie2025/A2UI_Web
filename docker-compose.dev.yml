# ========================================
#  A2UI_Web 开发环境 (热更新)
#
#  启动:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#  停止:  docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#  重建:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ========================================

services:
  # ==================== Backend — 源码挂载 + 自动重载 ====================
  backend:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./data/db:/app/data
      # 🔥 源码热更新：改 Python 代码自动重启
      - ./backend/app:/app/app
    environment:
      # Windows/Mac Docker Desktop 需要轮询模式才能检测到文件变更
      - WATCHFILES_FORCE_POLLING=true
    # 开发环境不自动重启（避免改 compose 时误重启丢失调试状态）
    restart: "no"

  # ==================== Frontend — Vite HMR ====================
  frontend:
    build:
      target: development
    container_name: a2ui-frontend-dev
    command: npx vite --host 0.0.0.0 --port 5173
    ports:
      # 可选：直接访问 Vite dev server 验证 HMR（绕过 Nginx 代理更准确定位问题）
      - "5173:5173"
    volumes:
      # 🔥 源码热更新：改 Vue/TS/CSS 浏览器即时刷新（HMR）
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/env.d.ts:/app/env.d.ts
      # node_modules 保留在容器内，不挂载（速度更快）
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost/api
      - VITE_PROXY_TARGET=http://nginx
    networks:
      - a2ui-network
    restart: "no"

  # ==================== Nginx — 代理到 Vite Dev Server ====================
  nginx:
    volumes:
      # 开发 nginx 配置：前端请求代理到 Vite（不再读静态 dist）
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    # 不再依赖 frontend_dist volume
    depends_on:
      - backend
      - frontend

# 开发环境 nginx 代理 Vite dev server，不需要前端的 dist volume
# 但 frontend 容器仍会挂载 production 的 frontend_dist（无害，只是用不到）
